name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un nouveau push sur la meme PR annule le run precedent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Validate dev and prod compose files
        run: |
          docker compose --project-directory . --env-file .env -f infra/compose.yml -f infra/compose.dev.yml config -q
          docker compose --project-directory . --env-file .env -f infra/compose.yml -f infra/compose.prod.yml config -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  smoke:
    name: Prod stack smoke test
    needs: [compose, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: make prod
      - run: make prod-migrate
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "api never became healthy"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose --project-directory . --env-file .env -f infra/compose.yml -f infra/compose.prod.yml logs --tail=200
      - if: always()
        run: make prod-down

  mobile:
    name: Flutter analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
