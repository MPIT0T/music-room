<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Music Room · Choose a new password</title>
    <link rel="stylesheet" href="/pages/email-pages.css" />
    <script type="module" src="/pages/email-pages.js"></script>
  </head>
  <body data-page="reset-password">
    <main>
      <h1>Choose a new password</h1>
      <p id="intro">At least 8 characters. You will be signed out of every device.</p>
      <form id="form">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        />
        <label for="confirm">Repeat it</label>
        <input
          id="confirm"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        />
        <button type="submit">Change my password</button>
      </form>
      <p id="status" role="status" hidden></p>
    </main>
  </body>
</html>
